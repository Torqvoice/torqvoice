name: "[Build] Dev Image"

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev-${{ steps.sha.outputs.short }}

      # A short hash of the server action key, so a new key rebuilds Next
      # instead of reusing a cached build (see the Dockerfile).
      - name: Fingerprint the server action key
        id: actions_key
        env:
          KEY: ${{ secrets.NEXT_SERVER_ACTIONS_BUILD_KEY }}
        run: echo "id=$(printf '%s' "$KEY" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=dev-${{ steps.sha.outputs.short }}
            NEXT_ACTIONS_FINGERPRINT=${{ steps.actions_key.outputs.id }}
          # Keeps server action IDs the same from build to build (see the Dockerfile).
          secrets: |
            next_actions_key=${{ secrets.NEXT_SERVER_ACTIONS_BUILD_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
