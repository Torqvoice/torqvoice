name: CLA Assistant

# Asks each new contributor to accept .github/CLA.md on their first pull
# request, and records the acceptance in a JSON file on the cla-signatures
# branch so main stays clean. Contributors accept by posting the exact
# sentence below as a comment; "recheck" re-runs the check after a signature.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/Torqvoice/torqvoice/blob/main/.github/CLA.md'
          path-to-signatures: 'signatures/cla-v1.json'
          # Must exist and must not be branch-protected; the bot commits to it.
          branch: 'cla-signatures'
          allowlist: sinamics,dependabot[bot],github-actions[bot],bot*
          create-file-commit-message: 'Create the CLA signature file'
          signed-commit-message: '$contributorName signed the CLA in $owner/$repo#$pullRequestNo'
          custom-notsigned-prcomment: 'Thanks for the pull request. Please read the [Contributor License Agreement]($pathToCLADocument) and accept it by posting the comment below. Once is enough. Contributing for a company? See [CONTRIBUTING.md](https://github.com/Torqvoice/torqvoice/blob/main/CONTRIBUTING.md#contributor-license-agreement).'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
          lock-pullrequest-aftermerge: true
